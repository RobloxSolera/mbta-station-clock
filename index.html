<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBTA Red Line Station Clock</title>
    <style>
        body {
            background-color: black;
            color: orange;
            font-family: "Courier New", monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .clock-container {
            display: flex;
            justify-content: space-between;
            width: 80%;
            text-align: center;
        }
        .station {
            font-size: 4rem;
            width: 45%;
        }
        .countdown {
            font-size: 6rem;
            font-weight: bold;
            width: 45%;
        }
        .status {
            font-size: 2rem;
            margin-top: 20px;
            color: yellow;
        }
        .time {
            font-size: 2rem;
            color: white;
        }
    </style>
</head>
<body>

<div class="clock-container">
    <div class="station" id="station">Loading...</div>
    <div class="countdown">
        <div id="countdown">-- min</div>
        <div id="time" class="time">Loading...</div>
    </div>
</div>

<div id="status" class="status">Loading...</div>

<script>
    const stopId = "place-alfcl";  // Alewife stop ID for Red Line
    const route = "Red";

    async function fetchData() {
        const res = await fetch(
            `https://api-v3.mbta.com/predictions?filter[stop]=${stopId}&filter[route]=${route}`
        );
        const data = await res.json();
        
        if (data.data.length === 0) {
            console.error("No data returned from MBTA API.");
            return;
        }

        const now = new Date().getTime();

        // Find next arrival time
        const times = data.data
            .map(t => new Date(t.attributes.arrival_time).getTime())
            .filter(t => t > now)
            .sort();

        if (times.length === 0) {
            document.getElementById("countdown").textContent = "No trains";
            document.getElementById("status").textContent = "";
            return;
        }

        const next = times[0];
        const mins = Math.round((next - now) / 60000);

        // Log data to check if everything is correct
        console.log("Next train in minutes:", mins);

        // Update station and countdown
        document.getElementById("station").textContent = "Alewife"; // Customize destination if needed
        document.getElementById("countdown").textContent = `${mins} min`;

        let status = "";
        let announcement = "";

        // Custom announcement when the train is approaching
        if (mins <= 1) {
            announcement = `Attention passengers: The next train to Alewife is now approaching. Please stand back from the platform edge.`;
            status = "Train to Alewife is now boarding!";
        } else if (mins <= 5) {
            status = `Train approaching with new Red Line cars!`;
        } else {
            status = "Waiting for the next train.";
        }

        document.getElementById("status").textContent = status;

        // Show the custom announcement
        document.getElementById("announcement").textContent = announcement;

        updateTime();
    }

    function updateTime() {
        document.getElementById("time").textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    fetchData();
    setInterval(fetchData, 30000); // Update every 30 seconds
    setInterval(updateTime, 1000); // Real-time clock update
</script>

</body>
</html>
