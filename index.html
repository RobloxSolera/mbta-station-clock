<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBTA Red Line Station Clock</title>
    <style>
        body {
            background-color: black;
            color: orange;
            font-family: "Courier New", monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            padding: 20px;
        }

        /* Temporary test message to verify if the page is loading */
        h1 {
            color: white;
        }

        .station-list {
            display: flex;
            flex-direction: column;
            width: 100%;
            align-items: center;
            text-align: center;
        }

        .station-container {
            width: 80%;
            margin: 20px 0;
            padding: 10px;
            border: 2px solid orange;
            border-radius: 10px;
            background-color: #333;
        }

        .station-name {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .countdown {
            font-size: 6rem;
            font-weight: bold;
        }

        .status {
            font-size: 2rem;
            margin-top: 10px;
            color: yellow;
        }

        .time {
            font-size: 2rem;
            color: white;
        }

        .train-info {
            display: flex;
            justify-content: space-between;
            width: 100%;
            text-align: center;
        }

        .left-section, .right-section {
            width: 45%;
            display: inline-block;
        }
    </style>
</head>
<body>

<!-- Test message to verify content rendering -->
<h1>Website is loading correctly!</h1>

<div class="station-list" id="stationList">
    <!-- Dynamically populated stations -->
</div>

<script>
    const stations = [
        { id: "place-alfcl", name: "Alewife" },
        { id: "place-ashmt", name: "Ashmont" },
        { id: "place-brntn", name: "Braintree" },
        { id: "place-davis", name: "Davis" },
        { id: "place-kencl", name: "Kendall/MIT" },
        { id: "place-port", name: "Porter" },
        { id: "place-alev", name: "Alewife" },
        // Add more Red Line stations as needed
    ];

    async function fetchDataForStation(station) {
        try {
            const res = await fetch(
                `https://api-v3.mbta.com/predictions?filter[stop]=${station.id}&filter[route]=Red`
            );
            const data = await res.json();

            if (!data.data || data.data.length === 0) {
                document.getElementById(`${station.id}-countdown`).textContent = "No trains";
                document.getElementById(`${station.id}-status`).textContent = "No upcoming trains.";
                return;
            }

            const now = new Date().getTime();
            const times = data.data
                .map(t => new Date(t.attributes.arrival_time).getTime())
                .filter(t => t > now)
                .sort();

            if (times.length === 0) {
                document.getElementById(`${station.id}-countdown`).textContent = "No trains";
                document.getElementById(`${station.id}-status`).textContent = "";
                return;
            }

            const next = times[0];
            const mins = Math.round((next - now) / 60000);

            document.getElementById(`${station.id}-countdown`).textContent = `${mins} min`;

            let statusMessage = "";
            let announcement = "";

            if (mins <= 1) {
                announcement = `Attention passengers: The next train to ${station.name} is now approaching. Please stand back from the platform edge.`;
                statusMessage = `Train to ${station.name} is now boarding!`;
            } else if (mins <= 5) {
                statusMessage = `Train approaching with new Red Line cars!`;
            } else {
                statusMessage = "Waiting for the next train.";
            }

            document.getElementById(`${station.id}-status`).textContent = statusMessage;
            document.getElementById(`${station.id}-announcement`).textContent = announcement;

        } catch (error) {
            console.error("Error fetching data for station:", station.name, error);
        }
    }

    function createStationElements(station) {
        const stationContainer = document.createElement("div");
        stationContainer.classList.add("station-container");
        stationContainer.id = `${station.id}-container`;

        const stationName = document.createElement("div");
        stationName.classList.add("station-name");
        stationName.textContent = station.name;

        const trainInfo = document.createElement("div");
        trainInfo.classList.add("train-info");

        const leftSection = document.createElement("div");
        leftSection.classList.add("left-section");
        const countdown = document.createElement("div");
        countdown.classList.add("countdown");
        countdown.id = `${station.id}-countdown`;
        countdown.textContent = "-- min";

        leftSection.appendChild(countdown);

        const rightSection = document.createElement("div");
        rightSection.classList.add("right-section");
        const status = document.createElement("div");
        status.classList.add("status");
        status.id = `${station.id}-status`;
        status.textContent = "Loading...";

        const announcement = document.createElement("div");
        announcement.classList.add("status");
        announcement.id = `${station.id}-announcement`;
        announcement.textContent = "";

        rightSection.appendChild(status);
        rightSection.appendChild(announcement);

        trainInfo.appendChild(leftSection);
        trainInfo.appendChild(rightSection);

        stationContainer.appendChild(stationName);
        stationContainer.appendChild(trainInfo);

        document.getElementById("stationList").appendChild(stationContainer);

        // Fetch data for the station
        fetchDataForStation(station);
    }

    stations.forEach(station => {
        createStationElements(station);
    });

    setInterval(updateTime, 1000);  // Update time every second

    function updateTime() {
        const timeDisplay = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        document.getElementById("currentTime").textContent = timeDisplay;
    }
</script>

</body>
</html>
