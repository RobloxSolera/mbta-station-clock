<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBTA Red Line Station Clock</title>
    <style>
        body {
            background-color: black;
            color: orange;
            font-family: "Courier New", monospace;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .left, .right {
            display: inline-block;
            font-size: 5rem;
            margin: 20px;
        }

        .left {
            width: 40%;
            text-align: left;
        }

        .right {
            width: 40%;
            text-align: right;
        }

        .status {
            font-size: 2rem;
            margin-top: 20px;
            color: yellow;
        }

        .time {
            font-size: 2rem;
            margin-top: 30px;
            color: white;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="left" id="station">Loading...</div>
    <div class="right">
        <div id="countdown">-- min</div>
        <div id="time" class="time">Loading...</div>
    </div>
</div>

<div id="status" class="status"></div>

<script>
    const stopId = "place-alfcl";  // Alewife stop ID for Red Line
    const route = "Red";

    async function fetchData() {
        const res = await fetch(
            `https://api-v3.mbta.com/predictions?filter[stop]=${stopId}&filter[route]=${route}`
        );
        const data = await res.json();
        const now = new Date().getTime();

        // Find next arrival time
        const times = data.data
            .map(t => new Date(t.attributes.arrival_time).getTime())
            .filter(t => t > now)
            .sort();

        if (times.length === 0) {
            document.getElementById("countdown").textContent = "No trains";
            document.getElementById("status").textContent = "";
            return;
        }

        const next = times[0];
        const mins = Math.round((next - now) / 60000);

        document.getElementById("station").textContent = "Alewife"; // Customize destination if needed
        document.getElementById("countdown").textContent = `${mins} min`;

        let status = "";
        if (mins <= 1) {
            status = `Train to Alewife is now boarding! Please stand back from the platform edge.`;
        } else if (mins <= 5) {
            status = `Train approaching with new Red Line cars!`;
        } else {
            status = "Waiting for the next train.";
        }
        document.getElementById("status").textContent = status;

        updateTime();
    }

    function updateTime() {
        document.getElementById("time").textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    fetchData();
    setInterval(fetchData, 30000); // Update every 30 seconds
    setInterval(updateTime, 1000); // Real-time clock update
</script>

</body>
</html>
