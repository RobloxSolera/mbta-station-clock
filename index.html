<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBTA Red Line Station Clock</title>
    <style>
        body {
            background-color: black;
            color: orange;
            font-family: "Courier New", monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100vh;
            margin: 0;
        }

        .clock-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 80%;
            text-align: center;
            margin-bottom: 20px;
        }

        .station-name {
            font-size: 6rem;
            width: 45%;
            margin-right: 20px;
        }

        .train-info {
            font-size: 6rem;
            font-weight: bold;
            width: 45%;
        }

        .status {
            font-size: 2rem;
            color: yellow;
            margin-top: 10px;
        }

        .current-time {
            font-size: 2rem;
            color: white;
            margin-top: 20px;
        }

        .announcement {
            font-size: 2rem;
            color: yellow;
            font-weight: normal;
            margin-top: 10px;
        }

        .train-info-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .train-info-container > div {
            width: 45%;
        }
    </style>
</head>
<body>

<div class="clock-container">
    <!-- Station Name on the left and Train Countdown + Status on the right -->
    <div class="station-name" id="stationName">Alewife</div>
    <div class="train-info-container">
        <div class="train-info">
            <div id="countdown">4 min</div>
            <div id="status" class="status">Stopped</div>
        </div>
    </div>
</div>

<!-- Current time display -->
<div id="currentTime" class="current-time">9:18</div>

<!-- Announcement section -->
<div id="announcement" class="announcement">
    Attention passengers: The next train to Alewife is now approaching. Please stand back from the platform edge.
</div>

<script>
    // Station info
    const stationName = "Alewife"; // Example station
    const countdownTime = 4; // Example: 4 minutes
    const status = "Stopped"; // Example status

    // Set station name and countdown time
    document.getElementById("stationName").textContent = stationName;
    document.getElementById("countdown").textContent = `${countdownTime} min`;
    document.getElementById("status").textContent = status;

    // Announcement when the train is approaching
    const announcementText = `Attention passengers: The next train to ${stationName} is now approaching. Please stand back from the platform edge.`;
    document.getElementById("announcement").textContent = announcementText;

    // Update current time every second
    function updateTime() {
        document.getElementById("currentTime").textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    // Update time every second
    setInterval(updateTime, 1000);
</script>

</body>
</html>
